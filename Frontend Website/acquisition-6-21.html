</header><div class="acq-page">
      <div class="acq-shell">
        <section class="acq-card">
          <h1 class="acq-card__title">Create Account</h1>
          <p class="acq-card__lead">Get started with an account.</p>
          <p class="acq-required-note">* indicates a required field.</p>

          <form class="acq-form" action="#" method="get">
            <div class="acq-form-row">
              <div class="acq-field">
                <label class="wf-label" for="email">Email address *</label>
                <input class="wf-input" id="email" type="email" name="email" />
              </div>
              <div class="acq-field">
                <label class="wf-label" for="phone">Phone number *</label>
                <input class="wf-input" id="phone" type="tel" name="phone" />
              </div>
            </div>
            <div class="acq-field">
              <label class="wf-label" for="password">Create password *</label>
              <input class="wf-input" id="password" type="password" name="password" />
            </div>
            <div class="acq-field">
              <label class="wf-label" for="password2">Re-type password</label>
              <input class="wf-input" id="password2" type="password" name="password2" />
            </div>

            <div class="acq-check">
              <input type="checkbox" id="terms" name="terms" />
              <label for="terms">
                I agree to the <a href="#">terms and conditions</a> *
              </label>
            </div>

            <button type="submit" class="wf-btn wf-btn--primary acq-submit">Create Account</button>
          </form>

          <p class="acq-footer-link">
            Already have an account? <a href="acquisition-6-22.html">Sign in.</a>
          </p>
        </section>
