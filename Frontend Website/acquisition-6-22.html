</header><div class="acq-page">
      <div class="acq-shell">
        <p class="acq-brand">Timaflu</p>
        <section class="acq-card acq-card--login">
          <h1 class="acq-card__title acq-card__title--center">Welcome back</h1>

          <form class="acq-form" action="#" method="get">
            <div class="acq-field">
              <input class="wf-input" type="email" name="email" placeholder="Email address" aria-label="Email address" />
            </div>
            <div class="acq-field">
              <input class="wf-input" type="password" name="password" placeholder="Password" aria-label="Password" />
            </div>

            <div class="acq-login-row">
              <div class="acq-check acq-check--inline">
                <input type="checkbox" id="remember" name="remember" />
                <label for="remember">Remember me</label>
              </div>
              <a class="acq-link" href="#">Forgot password</a>
            </div>

            <button type="submit" class="wf-btn wf-btn--primary acq-submit">Log in</button>
          </form>

          <p class="acq-footer-link acq-footer-link--center">
            Don’t have an account? <a href="acquisition-6-21.html">Sign up.</a>
          </p>
