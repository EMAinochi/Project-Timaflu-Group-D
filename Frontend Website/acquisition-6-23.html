</header><div class="acq-page">
      <div class="acq-shell acq-shell--wide">
        <p class="acq-brand">Timaflu</p>
        <section class="acq-card acq-card--settings">
          <form class="acq-form acq-form--settings" action="#" method="get">
            <div class="acq-field">
              <label class="wf-label" for="company">Company Name</label>
              <input class="wf-input" id="company" type="text" name="company" value="Apotheek Den Bosch" />
            </div>
            <div class="acq-field">
              <label class="wf-label" for="current-pw">Current Password</label>
              <input class="wf-input" id="current-pw" type="password" name="currentPassword" />
            </div>
            <div class="acq-field">
              <label class="wf-label" for="new-pw">New Password</label>
              <input class="wf-input" id="new-pw" type="password" name="newPassword" />
            </div>
            <div class="acq-field">
              <label class="wf-label" for="settings-phone">Phone Number</label>
              <input class="wf-input" id="settings-phone" type="tel" name="phone" value="0612345678" />
            </div>
            <div class="acq-field">
              <label class="wf-label" for="region">Language &amp; Region</label>
              <select class="wf-input wf-select" id="region" name="region">
                <option selected>Netherlands</option>
              </select>
            </div>

            <div class="acq-settings-actions">
              <button type="submit" class="wf-btn wf-btn--primary wf-btn--sm">Confirm Changes</button>
            </div>
          </form>
        </section>
      </div>
    </div>
